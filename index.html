<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CS Viewer — third-person demo playback</title>
    <meta
      name="description"
      content="Watch a Counter-Strike 1.6 demo in third person, in the browser. Embeddable on any site."
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/page.css" />
  </head>
  <body>
    <!-- The widget mounts here and renders into its own shadow root. -->
    <div id="stage" hidden></div>

    <div id="start">
      <div class="panel">
        <h1>CS&nbsp;Viewer</h1>
        <p class="lead">
          Watch a Counter-Strike 1.6 demo in third person — the real map, the real player
          models, in your browser.
        </p>

        <label class="file-button">
          Choose a <code>.dem</code> file
          <input id="file-input" type="file" accept=".dem" hidden />
        </label>
        <p class="hint">…or drop one anywhere on this page.</p>

        <p id="bundled-row" class="hint" hidden>
          <button id="bundled-button" class="link-button" type="button">
            Play the bundled sample match
          </button>
        </p>

        <p id="start-error" class="start-error" hidden></p>

        <p class="footnote">
          Embeddable on your own site —
          <a href="https://github.com/Elkhan-Isayev/cs-viewer#embedding-it-on-your-own-site"
            >see the docs</a
          >.
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
